{% extends layout %}

{% block admin_content %}
<div class="max-w-md mx-auto harvest-card p-6 space-y-4">
  <div>
    <span class="text-xs font-extrabold uppercase tracking-wider text-emerald-700">KEAMANAN AKUN</span>
    <h1 class="text-xl font-extrabold text-[#142d1d] mt-1">Ganti Password ({{ current_user.username }})</h1>
  </div>

  <form method="POST" action="{{ url_for('ganti_password') }}" class="space-y-4">
    <div>
      <label class="block text-xs font-bold mb-1">Password Lama</label>
      <input
        type="password"
        name="password_lama"
        required
        class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm"
      />
    </div>
    <div>
      <label class="block text-xs font-bold mb-1">Password Baru (Minimal 6 karakter)</label>
      <input
        type="password"
        name="password_baru"
        required
        class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm"
      />
    </div>
    <div>
      <label class="block text-xs font-bold mb-1">Konfirmasi Password Baru</label>
      <input
        type="password"
        name="konfirmasi"
        required
        class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm"
      />
    </div>
    <button type="submit" class="w-full harvest-lime-btn py-2.5 text-xs">
      Simpan Password Baru
    </button>
  </form>
</div>
{% endblock %}
